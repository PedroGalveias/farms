[package]
name = "farms"
version = "0.6.1"
authors = ["Pedro Galveias <pedro.r.galveias@pm.me>", "Pedro Moleiro <pedro.r.p.moleiro@outlook.com>"]
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "farms"

[dependencies]
# Web framework
actix-web = "4.20"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

# Databases
# Redis is used through `deadpool_redis::redis` (the redis version deadpool-redis
# is built against), never as a direct dependency: pooled connections only
# implement that version's traits.
# deadpool-redis must stay on the version actix-session's `redis-pool` uses
# (0.23 for actix-session 0.12), since the same pool is handed to it in
# `startup::build_session_store`. Bump both together. Sessions go through the
# shared pool rather than actix-session's URL mode because URL mode turns
# redis's connection and response timeouts off.
# `script`: Lua scripts (EVALSHA with EVAL fallback) for the atomic rate limiter.
# `tokio-rustls-comp`: `rediss://` (TLS) support.
deadpool-redis = { version = "0.23", features = [
    "serde",
    "rt_tokio_1",
    "script",
    "tokio-rustls-comp",
] }
# `redis-session` is required for RedisSessionStore even in pooled mode.
actix-session = { version = "0.12", features = [
    "redis-session",
    "redis-session-rustls",
    "redis-pool",
] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
] }

# Configuration and serialization
config = { version = "0.15", features = ["yaml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-aux = "4.7"
rmp-serde = "1.3"
unicode-segmentation = "1.13"

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = ">=0.3.23", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-actix-web = ">=0.7.22"

# OpenTelemetry
opentelemetry = { version = "0.33", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "trace", "metrics", "internal-logs",
    "grpc-tonic", "tls-ring", "tls-roots",
    "http-proto", "reqwest-blocking-client", "reqwest-rustls"
] }
tracing-opentelemetry = "0.34"

# Utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
] }
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
rand = "0.10"
argon2 = "0.6"

# HTTP client for the email provider (rustls to match the rest of the stack).
# Also used by the integration tests, hence the `cookies` feature.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "cookies",
    "rustls"
] }
sha2 = "0.11"      # SHA-256 for verification token hashing
hex = "0.4"        # hex-encode token hashes for storage
validator = "0.21" # email validation (maintained crate, no handwritten regex)

[dev-dependencies]
once_cell = "1"
fake = "5.1"
claims = "0.8"
wiremock = "0.6" # mock the email provider's HTTP API in tests
